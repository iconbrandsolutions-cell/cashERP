     CASHLEDGER ERP - MASTER JAVASCRIPT ENGINE
     ========================================== -->
<script>
    // 1. Global State & LocalStorage Setup (অফলাইন সেভ করার জন্য)
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
    let staffList = JSON.parse(localStorage.getItem('staffList')) || [];

    // 2. Company Logo Upload & Save Logic
    function handleLogoUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const logoDataUrl = e.target.result;
                // Update Logo on Screen & Invoice
                document.querySelectorAll('.company-logo-img').forEach(img => img.src = logoDataUrl);
                // Save to LocalStorage
                localStorage.setItem('companyLogo', logoDataUrl);
                showNotification('Logo updated successfully!', 'success');
            };
            reader.readAsDataURL(file);
        }
    }

    // Load Saved Logo on Startup
    window.onload = () => {
        const savedLogo = localStorage.getItem('companyLogo');
        if (savedLogo) {
            document.querySelectorAll('.company-logo-img').forEach(img => img.src = savedLogo);
        }
        renderLedger(); // Load transactions
    };

    // 3. Invoice Row Addition (Add Item +)
    function addInvoiceRow() {
        const tbody = document.getElementById('invoice-items-body');
        const rowCount = tbody.children.length + 1;
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="border px-2 py-1"><input type="text" class="w-full item-name" placeholder="Item Name"></td>
            <td class="border px-2 py-1"><input type="number" class="w-full item-qty" value="1" oninput="calculateTotal()"></td>
            <td class="border px-2 py-1"><input type="number" class="w-full item-rate" value="0" oninput="calculateTotal()"></td>
            <td class="border px-2 py-1 item-row-total font-bold">0.00</td>
            <td class="border px-2 py-1 text-center text-red-500 cursor-pointer no-print" onclick="this.parentElement.remove(); calculateTotal();">✖</td>
        `;
        tbody.appendChild(tr);
    }

    // 4. Auto Calculate Total
    function calculateTotal() {
        let grandTotal = 0;
        const rows = document.querySelectorAll('#invoice-items-body tr');
        rows.forEach(row => {
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
            const rowTotal = qty * rate;
            row.querySelector('.item-row-total').innerText = rowTotal.toFixed(2);
            grandTotal += rowTotal;
        });
        document.getElementById('invoice-grand-total').innerText = grandTotal.toFixed(2);
    }

    // 5. Save Entry (Transaction)
    function saveTransaction() {
        const partyName = document.getElementById('party-name').value;
        const totalAmount = document.getElementById('invoice-grand-total').innerText;
        const date = new Date().toLocaleDateString();
        
        const newTxn = {
            id: Date.now(),
            date: date,
            party: partyName,
            amount: totalAmount,
            status: 'Pending'
        };
        
        transactions.push(newTxn);
        localStorage.setItem('transactions', JSON.stringify(transactions));
        
        renderLedger();
        showNotification('Transaction saved successfully!', 'success');
    }

    // 6. Edit & Delete Transaction
    function deleteTransaction(id) {
        if(confirm('Are you sure you want to delete this entry?')) {
            transactions = transactions.filter(txn => txn.id !== id);
            localStorage.setItem('transactions', JSON.stringify(transactions));
            renderLedger();
            showNotification('Entry deleted!', 'error');
        }
    }

    // 7. Render Ledger (অটোমেটিক টেবিল আপডেট)
    function renderLedger() {
        const ledgerBody = document.getElementById('ledger-table-body');
        if(!ledgerBody) return;
        
        ledgerBody.innerHTML = '';
        transactions.forEach(txn => {
            ledgerBody.innerHTML += `
                <tr class="hover:bg-slate-100">
                    <td class="px-4 py-2 border"><input type="checkbox" class="txn-checkbox" value="${txn.id}"></td>
                    <td class="px-4 py-2 border">${txn.date}</td>
                    <td class="px-4 py-2 border font-semibold">${txn.party}</td>
                    <td class="px-4 py-2 border text-green-600 font-bold">৳${txn.amount}</td>
                    <td class="px-4 py-2 border">
                        <button onclick="editTransaction(${txn.id})" class="text-blue-500 mx-1">✏️ Edit</button>
                        <button onclick="deleteTransaction(${txn.id})" class="text-red-500 mx-1">🗑️ Delete</button>
                    </td>
                </tr>
            `;
        });
    }

    // 8. Staff Salary Calculate Ledger
    function calculateStaffSalary(baseSalary, bonus, deduction) {
        const total = (parseFloat(baseSalary) + parseFloat(bonus)) - parseFloat(deduction);
        return total.toFixed(2);
    }

    // 9. Print, Share & Download Options
    function printInvoice() {
        window.print(); // CSS এর @media print কাজ করবে
    }

    function shareInvoice() {
        if (navigator.share) {
            navigator.share({
                title: 'Invoice Document',
                text: 'Please find the attached invoice details.',
                url: window.location.href // বা শেয়ারিং লিংক
            }).then(() => console.log('Successful share'))
              .catch((error) => console.log('Error sharing', error));
        } else {
            alert('Share feature is only available on mobile or supported browsers.');
        }
    }

    // 10. Notification Pulse System
    function showNotification(message, type) {
        const notif = document.createElement('div');
        notif.className = `fixed top-5 right-5 p-4 rounded shadow-lg text-white font-bold z-50 transition-all transform duration-500 ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
        notif.innerText = message;
        document.body.appendChild(notif);
        
        // Notification Icon Pulse Trigger
        const bell = document.getElementById('notif-bell');
        if(bell) bell.classList.add('animate-pulse', 'text-red-500');

        setTimeout(() => {
            notif.remove();
            if(bell) bell.classList.remove('animate-pulse', 'text-red-500');
        }, 3000);
    }
</script>
